name: Test and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: python3 -B -m unittest discover -s scripts/tests

  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report Apple toolchain
        run: |
          {
            echo '### Apple toolchain'
            echo '```text'
            swift --version
            xcodebuild -version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Package.resolved', 'mac/Package.swift') }}
      - name: Run Swift tests
        run: |
          if swift test --package-path mac --jobs 4 > "$RUNNER_TEMP/swift-test.log" 2>&1; then
            cat "$RUNNER_TEMP/swift-test.log"
          else
            cat "$RUNNER_TEMP/swift-test.log"
            python3 - "$RUNNER_TEMP/swift-test.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          errors = [line for line in lines if "error:" in line][:15]
          for line in errors or lines[-10:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Swift test diagnostic::{escaped}")
          PY
            {
              echo '### Swift test failure'
              echo '```text'
              tail -120 "$RUNNER_TEMP/swift-test.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: bash scripts/test-core.sh
      - run: swift run --package-path mac --jobs 4 TransportChecks
      - run: bash -n scripts/build-release.sh scripts/test-core.sh

  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [web, mac]
    runs-on: macos-15
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'testing' }}
    permissions:
      contents: write
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate version and channel
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tag = process.env.REF_NAME;
          const isTag = process.env.REF_TYPE === 'tag';
          const match = /^v(\d+\.\d+\.\d+)(?:-([a-zA-Z0-9][a-zA-Z0-9.-]*))?$/.exec(tag);
          if (isTag && !match) throw new Error('Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease');
          const version = isTag ? match[1] : '0.1.0';
          const stable = isTag && !match[2];
          const releaseTag = isTag ? tag : 'testing';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstable=${stable}\nrelease_tag=${releaseTag}\n`);
          NODE
      - name: Import optional self-signed identity
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo '::notice title=Ad-hoc signing::Add MACOS_SIGNING_P12_BASE64 and MACOS_SIGNING_P12_PASSWORD to keep Accessibility permission across updates.'
            exit 0
          fi
          # A fixed certificate needs no Apple account; it only has to stay the same between releases.
          keychain="$RUNNER_TEMP/gimme-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/gimme-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/gimme-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -A -f pkcs12
          rm -f "$RUNNER_TEMP/gimme-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(sed -e 's/^[[:space:]]*"//' -e 's/"$//' <<< "$line")"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          # Self-signed certificates are untrusted (CSSMERR_TP_NOT_TRUSTED), so `-v` would list none;
          # codesign does not need trust, so take the first matching identity instead.
          identity="$(security find-identity -p codesigning "$keychain" | grep -Eo '[0-9A-F]{40}' | head -1 || true)"
          if [[ -z "$identity" ]]; then
            echo 'MACOS_SIGNING_P12_BASE64 does not contain a code signing identity.' >&2
            exit 1
          fi
          {
            echo "GIMME_SIGNING_IDENTITY=$identity"
            echo "GIMME_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      - name: Build signed universal App
        env:
          GIMME_OUTPUT_DIR: ${{ runner.temp }}/gimme-release
          GIMME_VERSION: ${{ steps.version.outputs.version }}
          GIMME_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-release.sh
      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${GIMME_SIGNING_KEYCHAIN:-}" && -e "$GIMME_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$GIMME_SIGNING_KEYCHAIN"
          fi
      - name: Write installation notes
        run: |
          if [[ -n "${GIMME_SIGNING_IDENTITY:-}" ]]; then
            signing='a self-signed certificate (no Apple Developer ID)'
            update='Updates signed with the same certificate keep that permission. When upgrading from an earlier ad-hoc build, remove GimmeRemote from Privacy & Security → Accessibility with "−" once, then add it again.'
          else
            signing='ad-hoc code signing'
            update='If input stops working after an update, remove GimmeRemote from Privacy & Security → Accessibility with "−", then add it again.'
          fi
          {
            echo "This free release uses $signing and is not notarized by Apple."
            echo
            echo 'If macOS blocks the first launch, open System Settings → Privacy & Security → Open Anyway for GimmeRemote.'
            echo "Grant Accessibility permission to use remote input. $update"
            echo
            echo 'Stable releases are available through `brew install --cask lucientong/tap/gimme-remote` once the tap update completes.'
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          if [[ "$RELEASE_TAG" == testing ]]; then
            gh release delete testing --yes --cleanup-tag || true
            gh release create testing "$RUNNER_TEMP"/gimme-release/*.zip "$RUNNER_TEMP"/gimme-release/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "Testing · ${GITHUB_SHA:0:7}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [[ "$STABLE" == true ]]; then
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/gimme-release/*.zip "$RUNNER_TEMP"/gimme-release/SHA256SUMS \
              --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/gimme-release/*.zip "$RUNNER_TEMP"/gimme-release/SHA256SUMS \
              --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
          fi
      - name: Upload release assets for tap update
        if: steps.version.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/gimme-release/*.zip
          retention-days: 7

  homebrew:
    needs: package
    if: needs.package.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Check cross-repository permission
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo 'Add HOMEBREW_TAP_TOKEN with Contents: write access to lucientong/homebrew-tap.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: lucientong/homebrew-tap
          ref: master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Generate Cask from actual release checksum
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ needs.package.outputs.release_tag }}
        run: |
          python3 scripts/update-homebrew.py --version "$VERSION" --tag "$TAG" \
            --archive "release-assets/GimmeRemote-$VERSION-universal.zip" --tap tap
          ruby -c tap/Casks/gimme-remote.rb
      - name: Update tap
        working-directory: tap
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/gimme-remote.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "gimme-remote $VERSION"
          git pull --rebase origin master
          git push origin HEAD:master
